name: Python wheels

# Build the 'anari' wheels; cibuildwheel smoke-tests each one.
# Artifact actions stay on v4 so the workflow runs under act.

on:
  push:
    branches: [ next_release ]
    paths: &wheel_paths
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'code_gen/**'
      - 'src/anari/**'
      - 'src/helium/**'
      - 'src/anari_test_scenes/**'
      - 'src/devices/CMakeLists.txt'
      - 'src/devices/sink/**'
      - 'src/devices/debug/**'
      - '.github/scripts/**'
      - '.github/workflows/python_wheels.yml'
  pull_request:
    branches: [ main, next_release ]
    paths: *wheel_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The version, checked against the SDK
  check-anari-version:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12' # tomllib
    - id: check
      name: Check the version
      run: python .github/scripts/check_python_version.py

  build-anari-wheels:
    name: build anari (${{ matrix.os }}, ${{ matrix.arch }})
    needs: check-anari-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest ]
        include:
        - { os: ubuntu-24.04,     arch: x86_64 }
        - { os: ubuntu-24.04-arm, arch: aarch64 }
        - { os: macos-15,         arch: arm64 }
        - { os: macos-15-intel,   arch: x86_64 }
        - { os: windows-latest,   arch: AMD64 }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
      with:
        output-dir: wheelhouse
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: anari-wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: wheelhouse/*.whl
        if-no-files-found: error
