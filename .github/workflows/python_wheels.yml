name: Python wheels

# Build, validate and (on v* tags) publish the 'anari' and device wheels.
# Artifact actions stay on v4 so the workflow runs under act.

on:
  push:
    branches: [ next_release ]
    tags: [ 'v*' ]
    paths: &wheel_paths
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'code_gen/**'
      - 'src/anari/**'
      - 'src/helium/**'
      - 'src/anari_test_scenes/**'
      - 'src/devices/CMakeLists.txt'
      - 'src/devices/sink/**'
      - 'src/devices/debug/**'
      - 'src/devices/helide/**'
      - 'examples/empty_helium_device/**'
      - 'tests/python/**'
      - '.github/scripts/**'
      - '.github/workflows/python_wheels.yml'
  pull_request:
    branches: [ main, next_release ]
    paths: *wheel_paths
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: 'Publish the validated wheels to TestPyPI'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fails a release whose version doesn't match the tag or is already on PyPI
  check-anari-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12' # tomllib
    - id: check
      name: Check the version
      env: # not interpolated into the script
        RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: >
        python .github/scripts/check_python_version.py
        --github-output "$GITHUB_OUTPUT"
        ${RELEASE_TAG:+--tag "$RELEASE_TAG"}

  build-anari-wheels:
    name: build anari (${{ matrix.os }}, ${{ matrix.arch }})
    needs: check-anari-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest ]
        include:
        - { os: ubuntu-24.04,     arch: x86_64 }
        - { os: ubuntu-24.04-arm, arch: aarch64 }
        - { os: macos-15,         arch: arm64 }
        - { os: macos-15-intel,   arch: x86_64 }
        - { os: windows-latest,   arch: AMD64 }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize MSVC environment
      if: ${{ matrix.os == 'windows-latest' }}
      shell: pwsh
      run: .github/scripts/import_msvc_env.ps1
    - name: Build wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_ENVIRONMENT_WINDOWS: CC=cl CXX=cl
      with:
        output-dir: wheelhouse
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: anari-wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  validate-anari:
    name: validate anari (${{ matrix.name }}, Python ${{ matrix.python }})
    needs: build-anari-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [ manylinux x86_64, manylinux aarch64, macOS arm64, macOS x86_64, Windows AMD64 ]
        python: [ '3.10', '3.15' ]
        include:
        - { name: manylinux x86_64,  os: ubuntu-24.04 }
        - { name: manylinux aarch64, os: ubuntu-24.04-arm }
        - { name: macOS arm64,       os: macos-15 }
        - { name: macOS x86_64,      os: macos-15-intel }
        - { name: Windows AMD64,     os: windows-latest }
    env:
      LD_BIND_NOW: '1' # Linux: fail on missing symbols at load
    steps:
    - name: Check out only the validation suite and the template device
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: |
          tests/python
          examples/empty_helium_device
        sparse-checkout-cone-mode: true
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: anari-wheels-*
        merge-multiple: true
        path: dist
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true
    - name: Install the validation suite's requirements
      run: python -m pip install -r tests/python/requirements.txt cffi numpy
    - name: Install the built wheels
      run: python -m pip install --no-index --no-deps --force-reinstall --find-links dist anari
    - name: Run the validation suite
      run: python -m pytest tests/python -v -p no:cacheprovider

  # 'docker run', not a job container: JavaScript actions don't run on musl
  validate-anari-musllinux:
    name: validate anari (musllinux ${{ matrix.arch }}, Python ${{ matrix.python }})
    needs: build-anari-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64 ]
        python: [ '3.10', '3.15' ]
        include:
        - { arch: x86_64,  os: ubuntu-24.04 }
        - { arch: aarch64, os: ubuntu-24.04-arm }
    steps:
    - name: Check out only the validation suite and the template device
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: |
          tests/python
          examples/empty_helium_device
        sparse-checkout-cone-mode: true
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: anari-wheels-*
        merge-multiple: true
        path: dist
    - name: Validate in python:${{ matrix.python }}-alpine
      run: >
        docker run --rm -v "${{ github.workspace }}:/work" -w /work
        python:${{ matrix.python }}-alpine sh -euxc '
        apk add --no-cache cmake make g++;
        python -m venv /venv;
        /venv/bin/python -m pip install -r tests/python/requirements.txt cffi numpy;
        /venv/bin/python -m pip install --no-index --no-deps --find-links dist anari;
        /venv/bin/python -m pytest tests/python -v -p no:cacheprovider'

  publish-anari-testpypi:
    # Forks have no Trusted Publisher
    if: >-
      github.repository == 'KhronosGroup/ANARI-SDK' &&
      github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: [ check-anari-version, validate-anari, validate-anari-musllinux ]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/anari/${{ needs.check-anari-version.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing; nothing else in this job
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: anari-wheels-*
        merge-multiple: true
        path: dist
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist
        # Rehearsals repeat a version; TestPyPI never accepts one twice
        skip-existing: true

  publish-anari-pypi:
    # Forks have no Trusted Publisher
    if: >-
      github.repository == 'KhronosGroup/ANARI-SDK' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: [ check-anari-version, validate-anari, validate-anari-musllinux ]
    runs-on: ubuntu-24.04
    environment: # its reviewers approve each release
      name: publish anari wheels
      url: https://pypi.org/project/anari/${{ needs.check-anari-version.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing; nothing else in this job
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: anari-wheels-*
        merge-multiple: true
        path: dist
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        packages-dir: dist

  # Currently these jobs wait for *all* of `build-anari-wheels` to complete.
  # There's no mechanism to only require the matching platform's `anari` wheel
  # artifacts.
  # https://github.com/orgs/community/discussions/42335
  build-device-wheels:
    name: build ${{ matrix.package }} (${{ matrix.os }}, ${{ matrix.arch }})
    needs: build-anari-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15, windows-latest ]
        package:
        - helide
        include:
        - { os: ubuntu-24.04,     arch: x86_64 }
        # Embree's build runs out of memory inside of the `cibuildwheel`
        # container.
        # - { os: ubuntu-24.04-arm, arch: aarch64 }
        - { os: macos-15,         arch: arm64 }
        - { os: windows-latest,   arch: AMD64 }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize MSVC environment
      if: ${{ matrix.os == 'windows-latest' }}
      shell: pwsh
      run: .github/scripts/import_msvc_env.ps1
    - uses: actions/download-artifact@v4
      with:
        name: anari-wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: anari-wheelhouse
    - name: Extract ANARI wheel (Unix)
      if: ${{ matrix.os != 'windows-latest' }}
      shell: bash
      run: |
        wheel="$(find anari-wheelhouse -maxdepth 1 -name 'anari-*.whl' -print -quit)"
        test -n "$wheel"
        mkdir -p "src/devices/${{ matrix.package }}/.wheel-deps/anari"
        unzip -q "$wheel" -d "src/devices/${{ matrix.package }}/.wheel-deps/anari"
        echo "anari_ROOT=${{ github.workspace }}/src/devices/${{ matrix.package }}/.wheel-deps/anari/anari/sdk" >> "$GITHUB_ENV"
        mkdir -p "src/devices/${{ matrix.package }}/.wheel-deps/anari-wheelhouse"
        cp anari-wheelhouse/*.whl "src/devices/${{ matrix.package }}/.wheel-deps/anari-wheelhouse/"
        echo "PIP_FIND_LINKS=${{ github.workspace }}/src/devices/${{ matrix.package }}/.wheel-deps/anari-wheelhouse" >> "$GITHUB_ENV"
    - name: Extract ANARI wheel (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      shell: pwsh
      run: |
        $wheel = Get-ChildItem "anari-wheelhouse/anari-*.whl" | Select-Object -First 1
        if (-not $wheel) { throw "ANARI wheel artifact was not found" }
        $archive = Join-Path $env:RUNNER_TEMP "anari-wheel.zip"
        Copy-Item $wheel.FullName $archive
        $destination = Join-Path $env:GITHUB_WORKSPACE "src/devices/${{ matrix.package }}/.wheel-deps/anari"
        New-Item -ItemType Directory -Force $destination | Out-Null
        Expand-Archive $archive $destination -Force
        "anari_ROOT=$destination/anari/sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
        $wheelhouse = Join-Path $destination "..\anari-wheelhouse"
        New-Item -ItemType Directory -Force $wheelhouse | Out-Null
        Copy-Item "anari-wheelhouse/*.whl" $wheelhouse
        "PIP_FIND_LINKS=$wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Append
    - name: Install Embree and TBB
      if: ${{ matrix.package == 'helide' && matrix.os != 'ubuntu-24.04-arm' }}
      uses: ./.github/actions/install_embree
      with:
        install-dir: ${{ github.workspace }}/src/devices/helide/.wheel-deps/embree
    - name: Set delocate library search path (macOS)
      if: ${{ matrix.package == 'helide' && startsWith(matrix.os, 'macos-') }}
      shell: bash
      run: |
        embree_root="${GITHUB_WORKSPACE}/src/devices/helide/.wheel-deps/embree/embree"
        embree_lib_file="$(find "$embree_root" -name 'libembree4.4.dylib' -print -quit)"
        if [ -z "$embree_lib_file" ]; then
          echo "::error::libembree4.4.dylib was not found in the downloaded Embree package"
          exit 1
        fi
        embree_lib="$(dirname "$embree_lib_file")"
        tbb_lib="$(brew --prefix tbb)/lib"
        echo "DYLD_LIBRARY_PATH=$embree_lib:$tbb_lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    - name: Build wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_ENVIRONMENT_LINUX: anari_ROOT=/project/src/devices/${{ matrix.package }}/.wheel-deps/anari/anari/sdk PIP_FIND_LINKS=/project/src/devices/${{ matrix.package }}/.wheel-deps/anari-wheelhouse ${{ matrix.os == 'ubuntu-24.04' && 'CMAKE_PREFIX_PATH=/project/src/devices/helide/.wheel-deps/embree/embree:/project/src/devices/helide/.wheel-deps/embree/oneapi-tbb-2022.3.0 LD_LIBRARY_PATH=/project/src/devices/helide/.wheel-deps/embree/embree/lib:/project/src/devices/helide/.wheel-deps/embree/embree/lib64:/project/src/devices/helide/.wheel-deps/embree/oneapi-tbb-2022.3.0/lib' || '' }}
        CIBW_ENVIRONMENT_WINDOWS: CC=cl CXX=cl
        CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ${{ matrix.package == 'helide' && 'delvewheel repair --analyze-existing --add-path "{project}/.wheel-deps/embree/embree-4.4.1.x64.windows/bin;{project}/.wheel-deps/embree/oneapi-tbb-2022.3.0/redist/intel64/vc14" -w {dest_dir} {wheel}' || 'delvewheel repair -w {dest_dir} -v {wheel}' }}
      with:
        package-dir: src/devices/${{ matrix.package }}
        output-dir: wheelhouse
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wheels-${{ matrix.package }}-${{ matrix.os }}-${{ matrix.arch }}
        path: wheelhouse/*.whl
        if-no-files-found: error
