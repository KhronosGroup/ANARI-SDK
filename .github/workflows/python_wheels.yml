name: Python wheels

# Build, validate and (on v* tags) publish the 'anari' wheels.
# Artifact actions stay on v4 so the workflow runs under act.

on:
  push:
    branches: [ next_release ]
    tags: [ 'v*' ]
    paths: &wheel_paths
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'code_gen/**'
      - 'src/anari/**'
      - 'src/helium/**'
      - 'src/anari_test_scenes/**'
      - 'src/devices/CMakeLists.txt'
      - 'src/devices/sink/**'
      - 'src/devices/debug/**'
      - 'examples/empty_helium_device/**'
      - 'tests/python/**'
      - '.github/scripts/**'
      - '.github/workflows/python_wheels.yml'
  pull_request:
    branches: [ main, next_release ]
    paths: *wheel_paths
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: 'Publish the validated wheels to TestPyPI'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fails a release whose version doesn't match the tag or is already on PyPI
  check-anari-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12' # tomllib
    - id: check
      name: Check the version
      env: # not interpolated into the script
        RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: >
        python .github/scripts/check_python_version.py
        --github-output "$GITHUB_OUTPUT"
        ${RELEASE_TAG:+--tag "$RELEASE_TAG"}

  build-anari-wheels:
    name: build anari (${{ matrix.os }}, ${{ matrix.arch }})
    needs: check-anari-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest ]
        include:
        - { os: ubuntu-24.04,     arch: x86_64 }
        - { os: ubuntu-24.04-arm, arch: aarch64 }
        - { os: macos-15,         arch: arm64 }
        - { os: macos-15-intel,   arch: x86_64 }
        - { os: windows-latest,   arch: AMD64 }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
      with:
        output-dir: wheelhouse
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: anari-wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  validate-anari:
    name: validate anari (${{ matrix.name }}, Python ${{ matrix.python }})
    needs: build-anari-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [ manylinux x86_64, manylinux aarch64, macOS arm64, macOS x86_64, Windows AMD64 ]
        python: [ '3.10', '3.15' ]
        include:
        - { name: manylinux x86_64,  os: ubuntu-24.04 }
        - { name: manylinux aarch64, os: ubuntu-24.04-arm }
        - { name: macOS arm64,       os: macos-15 }
        - { name: macOS x86_64,      os: macos-15-intel }
        - { name: Windows AMD64,     os: windows-latest }
    env:
      LD_BIND_NOW: '1' # Linux: fail on missing symbols at load
    steps:
    - name: Check out only the validation suite and the template device
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: |
          tests/python
          examples/empty_helium_device
        sparse-checkout-cone-mode: true
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: anari-wheels-*
        merge-multiple: true
        path: dist
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true
    - name: Install the validation suite's requirements
      run: python -m pip install -r tests/python/requirements.txt cffi numpy
    - name: Install the built wheels
      run: python -m pip install --no-index --no-deps --force-reinstall --find-links dist anari
    - name: Run the validation suite
      run: python -m pytest tests/python -v -p no:cacheprovider

  publish-anari-testpypi:
    # Forks have no Trusted Publisher
    if: >-
      github.repository == 'KhronosGroup/ANARI-SDK' &&
      github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: [ check-anari-version, validate-anari ]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/anari/${{ needs.check-anari-version.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing; nothing else in this job
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: anari-wheels-*
        merge-multiple: true
        path: dist
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist
        # Rehearsals repeat a version; TestPyPI never accepts one twice
        skip-existing: true

  publish-anari-pypi:
    # Forks have no Trusted Publisher
    if: >-
      github.repository == 'KhronosGroup/ANARI-SDK' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    needs: [ check-anari-version, validate-anari ]
    runs-on: ubuntu-24.04
    environment: # its reviewers approve each release
      name: pypi
      url: https://pypi.org/project/anari/${{ needs.check-anari-version.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing; nothing else in this job
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: anari-wheels-*
        merge-multiple: true
        path: dist
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        packages-dir: dist
