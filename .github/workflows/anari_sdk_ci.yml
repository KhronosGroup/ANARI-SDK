name: ANARI-SDK CI

# halcyon has its own workflow (halcyon_ci.yml); changes confined to it don't
# rebuild the SDK here
on:
  push:
    branches: [ next_release ]
    paths-ignore:
      - 'src/devices/halcyon/**'
      - '.github/workflows/halcyon_ci.yml'
  pull_request:
    branches: [ main, next_release ]
    paths-ignore:
      - 'src/devices/halcyon/**'
      - '.github/workflows/halcyon_ci.yml'

env:
  ANARI_LIBRARY: helide

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        config: [Release, Debug]
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    # ptc needs MPI and oneTBB >= 2021.6; 22.04's apt TBB is 2021.5, so ptc
    # is built and tested on the 24.04 rows only
    - name: Install ptc dependencies
      if: ${{ matrix.os == 'ubuntu-24.04' }}
      run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libtbb-dev
    - name: Build and test
      uses: ./.github/actions/configure_and_build
      with:
        workspace: ${{ github.workspace }}
        config: ${{ matrix.config }}
        os: ${{ matrix.os }}
        shell: bash
        ptc: ${{ matrix.os == 'ubuntu-24.04' }}
    - name: Upload install
      if: ${{ matrix.config == 'Release' && matrix.os == 'ubuntu-22.04' }}
      uses: actions/upload-artifact@v4
      with:
        name: ANARI-SDK_ubuntu-22.04
        path: ${{ github.workspace }}/build/install

  build-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        config: [Release, Debug]
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and test
      uses: ./.github/actions/configure_and_build
      with:
        workspace: ${{ github.workspace }}
        config: ${{ matrix.config }}
        os: ${{ matrix.os }}
        shell: pwsh
    - name: Upload install
      if: ${{ matrix.config == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: ANARI-SDK_windows
        path: ${{ github.workspace }}/build/install

  build-macos:
    # iOS is 10x expensive to run on GitHub machines, so only run if we know something else passed as well
    needs: [build-linux, build-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        config: [Release]
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and test
      uses: ./.github/actions/configure_and_build
      with:
        workspace: ${{ github.workspace }}
        config: ${{ matrix.config }}
        os: ${{ matrix.os }}
        shell: bash
    - name: Upload install
      if: ${{ matrix.config == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: ANARI-SDK_macos
        path: ${{ github.workspace }}/build/install
