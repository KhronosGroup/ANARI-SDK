name: ANARI-SDK CI

on:
  push:
    branches: [ next_release ]
  pull_request:
    branches: [ main, next_release ]

env:
  ANARI_LIBRARY: helide

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        config: [Release, Debug]
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and test
      uses: ./.github/actions/configure_and_build
      with:
        workspace: ${{ github.workspace }}
        config: ${{ matrix.config }}
        os: ${{ matrix.os }}
        shell: bash
    - name: Upload install
      if: ${{ matrix.config == 'Release' && matrix.os == 'ubuntu-22.04' }}
      uses: actions/upload-artifact@v4
      with:
        name: ANARI-SDK_ubuntu-22.04
        path: ${{ github.workspace }}/build/install

  build-halcyon:
    # halcyon needs ISPC, and is built and tested on Linux only so far
    runs-on: ubuntu-22.04
    env:
      ISPC_VERSION: v1.28.2
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Install ISPC
      run: |
        curl -sSfL https://github.com/ispc/ispc/releases/download/${ISPC_VERSION}/ispc-${ISPC_VERSION}-linux.tar.gz \
          | tar xz -C ${{ runner.temp }}
        echo "${{ runner.temp }}/ispc-${ISPC_VERSION}-linux/bin" >> $GITHUB_PATH
    - name: Configure CMake
      run: >
        cmake -LA -B ${{ github.workspace }}/build
        -DBUILD_CTS=OFF
        -DBUILD_EXAMPLES=OFF
        -DBUILD_HALCYON_DEVICE=ON
        -DBUILD_HELIDE_DEVICE=ON
        -DBUILD_TESTING=ON
        -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release --parallel
    - name: halcyon Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest -R '^halcyon::' -C Release --output-on-failure

  build-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        config: [Release, Debug]
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and test
      uses: ./.github/actions/configure_and_build
      with:
        workspace: ${{ github.workspace }}
        config: ${{ matrix.config }}
        os: ${{ matrix.os }}
        shell: pwsh
    - name: Upload install
      if: ${{ matrix.config == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: ANARI-SDK_windows
        path: ${{ github.workspace }}/build/install

  build-macos:
    # iOS is 10x expensive to run on GitHub machines, so only run if we know something else passed as well
    needs: [build-linux, build-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        config: [Release]
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Build and test
      uses: ./.github/actions/configure_and_build
      with:
        workspace: ${{ github.workspace }}
        config: ${{ matrix.config }}
        os: ${{ matrix.os }}
        shell: bash
    - name: Upload install
      if: ${{ matrix.config == 'Release' }}
      uses: actions/upload-artifact@v4
      with:
        name: ANARI-SDK_macos
        path: ${{ github.workspace }}/build/install
